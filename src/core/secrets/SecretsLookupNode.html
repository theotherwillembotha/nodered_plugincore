<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("name",           { value:"", required:false })
        .addDefault("secretKey",      { value:"", required:false })
        .addDefault("secretProvider", { value:"__null__", required:false })
        .addDefault("outputProperty", { value:"payload", required:false })
        .setPaletteLabel("Secret Lookup")
        .setLabel(function() { return this.name || "Secret Lookup"; })
        .setIcon("font-awesome/fa-key")
        .setInput("message")
        .addOutputs("result")
</script>

<script type="text/javascript" template-section="onIncludeEditPrepare">
    let node = this;

    // Output property typedInput
    $("#node-input-outputProperty").typedInput({
        default: 'msg',
        types: ['msg']
    });
    if (node.outputProperty) {
        $("#node-input-outputProperty").typedInput('type',  'msg');
        $("#node-input-outputProperty").typedInput('value', node.outputProperty);
    }

    // Secret field — provider selector + key input
    PluginCore.initSecretField("node-input-secretKey", {
        node:          node,
        valueField:    "secretKey",
        providerField: "secretProvider",
        hideValue:     true,
    });
</script>

<script type="text/javascript" template-section="onIncludeEditSave">
    node = this;

    var _secret = PluginCore.readSecretField("node-input-secretKey");
    node.secretKey      = _secret.value;
    node.secretProvider = _secret.provider;
    PluginCore.destroySecretField("node-input-secretKey");

    node.outputProperty = $("#node-input-outputProperty").typedInput('value') || 'payload';
</script>

<script type="text/javascript" template-section="onIncludeEditCancel">
    PluginCore.destroySecretField("node-input-secretKey");
</script>

<script type="text/html" template-section="onIncludeEditForm">
    <div class="form-row">
        <label class="towb_editorlabel" for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Secret Lookup" />
    </div>

    <div class="form-row editorsectionheading">
        <i class="w-16 fa fa-key"></i> <span>Secret</span>
    </div>
    <div class="editorgroupborder">
        <div class="form-row nomargin">
            <label class="towb_editorlabel" for="node-input-secretKey">Key</label>
            <input type="text" id="node-input-secretKey" style="width:70%;" />
        </div>
    </div>

    <div class="form-row editorsectionheading">
        <i class="w-16 fa fa-sign-out"></i> <span>Output</span>
    </div>
    <div class="editorgroupborder">
        <div class="form-row nomargin">
            <label class="towb_editorlabel" for="node-input-outputProperty">Property</label>
            <input type="text" id="node-input-outputProperty" />
        </div>
    </div>
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
### Secret Lookup Node

Resolves a secret value using the configured provider and writes the result to the outgoing message.

#### Secret field

When no external secret providers are installed, the field behaves as a local password store — the value entered is used directly (NullProvider). When a provider is configured (e.g. OpenBao), the field value is treated as a lookup key passed to that provider's backend.

#### Provider selection

If more than one secret provider instance is deployed, a type-selector appears next to the field. Each option is labelled by the provider's shortcode. Select the appropriate instance per field.

#### Output

The resolved string value is written to the configured `msg` property (default: `msg.payload`).
</script>
