<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("name",      { value:"Hush Hush", required:true })
        .addDefault("shortcode", { value:"", required:true })
        .setPaletteLabel("Hush Hush Secret Provider")
        .setLabel(function() {
            var sc = this.shortcode ? "[" + this.shortcode + "] " : "";
            return sc + (this.name || "Hush Hush");
        })
</script>

<script type="text/javascript" template-section="onIncludeEditPrepare">
{
    let node = this;

    var $shortcode = $("#node-config-input-shortcode");
    var $shortcodeError = $("#hushhush-shortcode-error");

    function _validateShortcode() {
        var val = $shortcode.val() || '';
        val = val.replace(/\s/g, '');
        $shortcode.val(val);
        if (val.length < 2 || val.length > 6) {
            $shortcodeError.show();
            return false;
        }
        $shortcodeError.hide();
        return true;
    }

    $shortcode.on('input', _validateShortcode);

    // Warn if a provider with the same shortcode is already deployed.
    $.ajax({
        url: "secretsservice/instances",
        type: "GET",
        contentType: "application/json; charset=utf-8"
    }).then(function(instances) {
        var $conflict = $("#hushhush-shortcode-conflict");
        $shortcode.on('input change', function() {
            var current = ($shortcode.val() || '').trim().toLowerCase();
            var clash = instances.some(function(inst) {
                // Ignore the node itself when editing an existing instance.
                return inst.shortcode.toLowerCase() === current && inst.id !== node.id;
            });
            clash ? $conflict.show() : $conflict.hide();
        });
    });
}
</script>

            <strong>Hush Hush</strong> is a demonstration provider. It resolves secrets by reversing the lookup key.
            <br/>Example: <code>password</code> &rarr; <code>drowssap</code>
        </div>
    </div>
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
### Hush Hush Secret Provider

A demonstration secrets provider that resolves every lookup key by reversing its characters.

**This provider is not intended for production use.** Its purpose is to exercise the full provider lifecycle: registration, shortcode display in the field type selector, discovery via the secrets endpoint, and runtime resolution.

### Properties

: *name* (string) : A descriptive label for this provider instance, shown in the config node panel.
: *shortcode* (string, 2–6 chars) : A short identifier shown in the type-selector of secret fields. Must be unique across all deployed secret providers. Examples: `prod`, `test`, `ob-QA`.

### Behaviour

`resolve(key)` returns `key.split('').reverse().join('')`.
</script>
