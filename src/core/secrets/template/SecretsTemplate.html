<div template-section="onIncludeOnce">
<script type="text/javascript">
(function() {

    // =========================================================================
    // PluginCore.initSecretField / readSecretField / destroySecretField
    // =========================================================================
    //
    // Initialises a DOM <input> as a secret field.
    //
    // opts:
    //   node          {object}  — the node being edited
    //   valueField    {string}  — node property holding the key/value string
    //   providerField {string}  — node property holding the provider instance ID
    //   hideValue     {boolean} — true (default): NullProvider renders as password
    //
    // Lifecycle:
    //   Call PluginCore.readSecretField(id)    in onIncludeEditSave  → {value, provider}
    //   Call PluginCore.destroySecretField(id) in onIncludeEditSave and onIncludeEditCancel
    //
    // =========================================================================

    if (!window.PluginCore) { window.PluginCore = {}; }

    var _NULL_PROVIDER = "__null__";
    var _NULL_SHORTCODE = "local";

    function _getInstances() {
        return $.ajax({ url: "secretsservice/instances", type: "GET",
                        contentType: "application/json; charset=utf-8" });
    }

    function _storeMeta(id, meta) { $("#" + id).data("_sc_meta", meta); }
    function _getMeta(id)         { return $("#" + id).data("_sc_meta") || {}; }

    PluginCore.initSecretField = function(elementId, opts) {
        var node          = opts.node;
        var hideValue     = (opts.hideValue !== false);
        var savedValue    = node[opts.valueField]    || '';
        var savedProvider = node[opts.providerField] || _NULL_PROVIDER;

        _getInstances().then(function(instances) {
            var $el = $("#" + elementId);

            if (!instances || instances.length === 0) {
                // NullProvider only — render as plain password / text field.
                $el.attr("type", hideValue ? "password" : "text").val(savedValue);
                _storeMeta(elementId, { mode: "plain" });
            } else {
                // Multiple providers — render as typedInput.
                var types = [{
                    value: _NULL_PROVIDER, label: _NULL_SHORTCODE + ' ', hasValue: true
                }];
                instances.forEach(function(inst) {
                    types.push({ value: inst.id, label: inst.shortcode + ' ', hasValue: true });
                });

                $el.typedInput({ default: savedProvider, types: types });
                $el.typedInput('type',  savedProvider);
                $el.typedInput('value', savedValue);

                // Mask the visible inner input when NullProvider is selected and hideValue=true.
                // typedInput hides the original <input> and inserts a sibling container;
                // we find the visible value input inside that container.
                function _applyMask(providerId) {
                    var $container = $el.closest(".red-ui-typedInput-container");
                    // Fallback: try the wrapper inserted just after the original element.
                    if (!$container.length) $container = $el.next(".red-ui-typedInput-container");
                    var $inner = $container.find("input.red-ui-typedInput-input");
                    if (!$inner.length) $inner = $container.find("input:not([type=hidden]):visible");
                    $inner.attr("type", (providerId === _NULL_PROVIDER && hideValue)
                                        ? "password" : "text");
                }
                // Use setTimeout so typedInput has finished updating the DOM before we act.
                $el.on('typedinputtypechange', function(_e, t) { setTimeout(function() { _applyMask(t); }, 0); });
                setTimeout(function() { _applyMask(savedProvider); }, 0);

                _storeMeta(elementId, { mode: "typedinput" });
            }
        });
    };

    PluginCore.readSecretField = function(elementId) {
        var meta = _getMeta(elementId);
        var $el  = $("#" + elementId);
        if (meta.mode === "plain") {
            return { value: $el.val() || '', provider: _NULL_PROVIDER };
        }
        return { value:    $el.typedInput('value') || '',
                 provider: $el.typedInput('type')  || _NULL_PROVIDER };
    };

    PluginCore.destroySecretField = function(elementId) {
        var meta = _getMeta(elementId);
        var $el  = $("#" + elementId);
        if (meta.mode === "typedinput") { try { $el.typedInput('destroy'); } catch(_e) {} }
        $el.removeData("_sc_meta");
    };


    // =========================================================================
    // Secret Providers sidebar
    // =========================================================================

    if (window._secretsSidebarRegistered) return;
    window._secretsSidebarRegistered = true;

    // ── Styles ────────────────────────────────────────────────────────────────

    $('<style>').text([
        '#secrets-sidebar-content { padding:0; display:flex; flex-direction:column; height:100%; overflow:hidden; }',
        '#secrets-sidebar-content .sc-header { display:flex; align-items:center; justify-content:space-between;',
        '    padding:6px 8px; border-bottom:1px solid #e0e0e0; flex-shrink:0; }',
        '#secrets-sidebar-content .sc-header-title { font-weight:600; font-size:0.88em; color:#555; }',
        '#secrets-sidebar-content .sc-header-buttons { display:flex; gap:4px; }',
        '#secrets-sidebar-content .sc-table-wrap { flex:1; overflow-y:auto; padding:4px 0; }',
        '#secrets-sidebar-content table { width:100%; border-collapse:collapse; }',
        '#secrets-sidebar-content th { padding:5px 10px; text-align:left; font-size:0.78em;',
        '    color:#888; text-transform:uppercase; letter-spacing:0.04em;',
        '    border-bottom:1px solid #e0e0e0; white-space:nowrap; }',
        '#secrets-sidebar-content td { padding:6px 10px; vertical-align:middle;',
        '    border-bottom:1px solid #f0f0f0; font-size:0.9em; }',
        '#secrets-sidebar-content tr.sc-row:hover td { background:#f5f7fa; cursor:pointer; }',
        '#secrets-sidebar-content .sc-shortcode { font-family:monospace; font-weight:600; }',
        '#secrets-sidebar-content .sc-type { color:#999; font-size:0.82em; }',
        '#secrets-sidebar-content .sc-empty { text-align:center; color:#bbb;',
        '    font-style:italic; padding:24px 0; }',
        '#secrets-sidebar-content .sc-status { font-size:11px; }',
        '#secrets-sidebar-content .sc-status.deployed { color:#22aa44; }',
        '#secrets-sidebar-content .sc-status.pending  { color:#e88000; }',
        '.sc-provider-dropdown { position:absolute; background:white; border:1px solid #ccc;',
        '    border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.15);',
        '    max-height:200px; overflow-y:auto; z-index:1000; min-width:200px; }',
        '.sc-provider-dropdown .sc-drop-item { padding:7px 14px; cursor:pointer; font-size:0.9em; }',
        '.sc-provider-dropdown .sc-drop-item:hover { background:#f0f0f0; }',
        '.sc-provider-dropdown .sc-drop-empty { padding:8px 14px; color:#aaa; font-style:italic; font-size:0.9em; }',
    ].join('\n')).appendTo('head');

    // ── State ─────────────────────────────────────────────────────────────────

    var _typeCache = null; // [{id, name}] — invalidated on deploy

    function _fetchTypes() {
        if (_typeCache) return Promise.resolve(_typeCache);
        return $.ajax({ url: "nodetypeservice/find?tag=SecretsProvider", type: "GET",
                        contentType: "application/json; charset=utf-8" })
               .then(function(t) { _typeCache = t || []; return _typeCache; },
                     function()  { _typeCache = [];     return _typeCache; });
    }

    function _fetchDeployedIds() {
        return $.ajax({ url: "secretsservice/instances", type: "GET",
                        contentType: "application/json; charset=utf-8" })
               .then(function(list) {
                   var m = {};
                   (list || []).forEach(function(i) { m[i.id] = true; });
                   return m;
               }, function() { return {}; });
    }

    function _configNodes(types) {
        var ids = types.map(function(t) { return t.id; });
        var out = [];
        RED.nodes.eachConfig(function(n) { if (ids.indexOf(n.type) >= 0) out.push(n); });
        return out;
    }

    function _typeName(typeId, types) {
        var t = types.find(function(x) { return x.id === typeId; });
        // Strip common suffix for brevity: "HushHushSecretProviderConfigNode" → "HushHush"
        var raw = t ? t.name : typeId;
        return raw.replace(/\s*Secret\s*Provider\s*(Config\s*Node)?$/i, '').trim() || raw;
    }

    // ── Build content (header bar + scrollable table) ─────────────────────────

    var $content = $('<div id="secrets-sidebar-content">');

    // Header bar lives inside content so we control positioning and the
    // dropdown always opens downward within the panel — not off-screen.
    var $header = $('<div class="sc-header">').appendTo($content);
    $('<span class="sc-header-title">').text('Secret Providers').appendTo($header);
    var $headerBtns = $('<div class="sc-header-buttons">').appendTo($header);

    $('<a class="red-ui-button" title="Refresh">')
        .append($('<i class="fa fa-refresh">'))
        .on('click', function() { _refreshNow(); })
        .appendTo($headerBtns);

    var $addBtn = $('<a class="red-ui-button" title="Add Secret Provider">')
        .append($('<i class="fa fa-plus">'))
        .on('click', function(e) { e.stopPropagation(); _showAddDropdown($(this)); })
        .appendTo($headerBtns);

    var $wrap  = $('<div class="sc-table-wrap">').appendTo($content);
    var $table = $('<table>').appendTo($wrap);

    $('<thead>').append(
        $('<tr>').append(
            $('<th>').text('Code'),
            $('<th>').text('Name'),
            $('<th>').text('Type'),
            $('<th style="text-align:center;" title="Deploy status">').html('&#9679;')
        )
    ).appendTo($table);

    var $tbody = $('<tbody>').appendTo($table);

    // ── Debounced refresh ─────────────────────────────────────────────────────
    // nodes:add fires once per node during page load, so without debouncing
    // _doRefresh() runs N times concurrently and all N append their rows to
    // $tbody, producing duplicates. A short delay coalesces the burst into one.
    var _refreshTimer = null;
    function _refresh() {
        if (_refreshTimer) clearTimeout(_refreshTimer);
        _refreshTimer = setTimeout(_doRefresh, 80);
    }
    function _refreshNow() {
        if (_refreshTimer) { clearTimeout(_refreshTimer); _refreshTimer = null; }
        _doRefresh();
    }

    function _doRefresh() {
        _refreshTimer = null;
        _fetchTypes().then(function(types) {
            var nodes = _configNodes(types);
            $tbody.empty();

            if (nodes.length === 0) {
                $tbody.append(
                    $('<tr>').append(
                        $('<td class="sc-empty" colspan="4">').text('No secret providers configured.')
                    )
                );
                return;
            }

            _fetchDeployedIds().then(function(deployed) {
                nodes.forEach(function(n) {
                    var shortcode = n.shortcode || '—';
                    var name      = n.name || n.id;
                    var typeName  = _typeName(n.type, types);
                    var isDeployed = !!deployed[n.id];

                    var $status = $('<span class="sc-status">').html('&#9679;')
                        .addClass(isDeployed ? 'deployed' : 'pending')
                        .attr('title', isDeployed ? 'Deployed' : 'Not yet deployed');

                    $('<tr class="sc-row">')
                        .append($('<td class="sc-shortcode">').text(shortcode))
                        .append($('<td>').text(name))
                        .append($('<td class="sc-type">').text(typeName))
                        .append($('<td style="text-align:center;">').append($status))
                        .on('click', function() {
                            var live = RED.nodes.node(n.id);
                            if (live) RED.editor.edit(live);
                        })
                        .appendTo($tbody);
                });
            });
        });
    } // end _doRefresh

    // ── Add dropdown ──────────────────────────────────────────────────────────

    function _showAddDropdown($btn) {
        $('.sc-provider-dropdown').remove();
        $(document).off('mousedown.sc-dropdown');

        _fetchTypes().then(function(types) {
            var $drop = $('<div class="sc-provider-dropdown red-ui-editor">');

            if (types.length === 0) {
                $drop.append($('<div class="sc-drop-empty">').text('No provider types installed.'));
            } else {
                types.forEach(function(t) {
                    $('<div class="sc-drop-item">').text(t.name)
                        .on('click', function() {
                            $drop.remove();
                            $(document).off('mousedown.sc-dropdown');
                            // Open the config node editor. The dummy property means
                            // Node-RED won't find a form field to update — that's fine;
                            // the node:add event fires and we refresh the list.
                            RED.editor.editConfig("#_sc_sidebar_dummy_", t.id, "_ADD_");
                        })
                        .appendTo($drop);
                });
            }

            $('body').append($drop);
            // Position: align right edges, open downward; flip upward if it
            // would overflow the bottom of the viewport.
            var btnBottom  = $btn.offset().top + $btn.outerHeight() + 2;
            var dropHeight = $drop.outerHeight();
            var top = (btnBottom + dropHeight > $(window).height())
                      ? $btn.offset().top - dropHeight - 2
                      : btnBottom;
            $drop.css({
                top:  top,
                left: $btn.offset().left + $btn.outerWidth() - $drop.outerWidth()
            });

            $(document).on('mousedown.sc-dropdown', function(e) {
                if (!$(e.target).closest('.sc-provider-dropdown').length) {
                    $drop.remove();
                    $(document).off('mousedown.sc-dropdown');
                }
            });
        });
    }

    // ── Register tab ─────────────────────────────────────────────────────────

    if (RED.sidebar && RED.sidebar.addTab) {
        RED.sidebar.addTab({
            id:            "secrets-providers",
            label:         "Secrets",
            name:          "Secret Providers",
            content:       $content[0],
            closeable:     true,
            disableOnEdit: false,
            iconClass:     "fa fa-key"
        });
    }

    // ── Reactive refresh ──────────────────────────────────────────────────────

    RED.events.on('nodes:add',    _refresh);
    RED.events.on('nodes:remove', _refresh);
    RED.events.on('nodes:change', _refresh);

    // Invalidate type cache on deploy — new provider plugins may have registered types.
    RED.events.on('deploy', function() { _typeCache = null; _refresh(); });

    // Initial population.
    _refresh();

}());
</script>
</div>
