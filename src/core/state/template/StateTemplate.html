<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("stateReference", { required:true, value:'', type:"DelegatedConfigReferenceNode"})
</script>

<script type="text/javascript" template-section="onIncludeEditPrepare">
    let _stateNameSuffix = (templateConfig && templateConfig.nameSuffix) ? templateConfig.nameSuffix : '-State';
    let _stateStates     = (templateConfig && templateConfig.defaultStates) ? templateConfig.defaultStates : null;

    window.__stateTemplateContext = {
        defaultName: (node.name || node.type) + _stateNameSuffix,
        states: _stateStates
    };

    let stateSection = $("#section_stateconfig");
    let stateContainer = stateSection.find(".editorgroupborder");

    let getStateProviderTypes = async function() {
        let types = [];
        await $.ajax({
            url: "nodetypeservice/find?tag=StateProvider",
            type: "GET",
            contentType: "application/json; charset=utf-8",
            success: (response) => { types = response; },
            error: (jqXHR, textStatus, errorThrown) => { console.log(jqXHR, textStatus, errorThrown); },
        });
        return types;
    };

    let getStateProviders = async () => {
        let providers = [];
        let providerTypes = (await getStateProviderTypes()).map(t => t.id);
        RED.nodes.eachConfig(cfg => {
            if (providerTypes.includes(cfg.type)) {
                providers.push({ id: cfg.id, name: cfg.label(), type: cfg.type });
            }
        });
        return providers;
    };

    let stateSelector   = stateContainer.find("#state-selector");
    let stateEditButton = stateContainer.find("#state-edit-btn");
    let stateAddButton  = stateContainer.find("#state-add-btn");

    let updateStateSelectorList = async () => {
        stateSelector.empty();
        (await getStateProviders()).forEach(provider => {
            $('<option value="' + provider.id + '">' + provider.name + '</option>').appendTo(stateSelector);
        });
        $('<option value="_ADD_">none</option>').appendTo(stateSelector);
    };

    stateEditButton.on('click', async function(event) {
        event.stopPropagation();
        if (stateEditButton.hasClass("disabled")) return;
        let selectedProvider = (await getStateProviders()).find(p => p.id === stateSelector.val());
        if (selectedProvider) {
            RED.editor.editConfig("#state-selector", selectedProvider.type, selectedProvider.id);
        }
    });

    stateAddButton.on('click', function(event) {
        event.stopPropagation();
        let $btn = $(event.currentTarget);
        let btnOffset = $btn.offset();
        let btnH = $btn.outerHeight();
        let btnW = $btn.outerWidth();
        $('.statetype-dropdown').remove();

        getStateProviderTypes().then(providerTypes => {
            let $dropdown = $('<div class="statetype-dropdown red-ui-editor"></div>').css({
                position: 'absolute',
                zIndex: 1000
            });

            providerTypes.forEach(providerType => {
                $('<div class="dropdown-item"></div>')
                    .text(providerType.name)
                    .data('value', providerType.id)
                    .css({ padding: '4px 8px', cursor: 'pointer' })
                    .appendTo($dropdown);
            });

            $('body').append($dropdown);
            $dropdown.css({
                top:  btnOffset.top + btnH,
                left: Math.max(0, btnOffset.left + btnW - $dropdown.outerWidth())
            });

            $(document).on('mousedown.statedropdown', function(e) {
                if (!$(e.target).closest('.statetype-dropdown').length) {
                    $dropdown.remove();
                    $(document).off('mousedown.statedropdown');
                }
            });

            $dropdown.on('click', '.dropdown-item', function(e) {
                e.stopPropagation();
                const selectedValue = $(this).data('value');
                $dropdown.remove();
                RED.editor.editConfig("#state-selector", selectedValue, "_ADD_");
            });
        });
    });

    stateSelector.on("focus", updateStateSelectorList);
    stateSelector.on('change', function() {
        if ("_ADD_" === stateSelector.val()) {
            stateEditButton.addClass("disabled");
        } else {
            stateEditButton.removeClass("disabled");
        }
    });

    let _stateNodeAddHandler = function(addedNode) {
        getStateProviderTypes().then(function(types) {
            let typeIds = types.map(function(t) { return t.id; });
            if (typeIds.indexOf(addedNode.type) < 0) return;
            updateStateSelectorList().then(() => {
                stateSelector.val(addedNode.id);
                stateSelector.trigger('change');
            });
        });
    };
    RED.events.on('nodes:add', _stateNodeAddHandler);
    stateSelector.data('nodeAddHandler', _stateNodeAddHandler);

    let stateNoProvidersNote = $("#state-no-providers-note");
    getStateProviderTypes().then(providerTypes => {
        if (providerTypes.length === 0) {
            stateNoProvidersNote.show();
            return;
        }
        stateSection.show();
        updateStateSelectorList().then(() => {
            stateSelector.val(node.stateReference || '_ADD_');
            stateSelector.trigger('change');
        });
    });
</script>

<script type="text/javascript" template-section="onIncludeEditSave">
    node = this;

    var _stateAddHandler = $("#state-selector").data('nodeAddHandler');
    if (_stateAddHandler) {
        RED.events.off('nodes:add', _stateAddHandler);
        $("#state-selector").data('nodeAddHandler', null);
    }

    var _stateOldRef = node.stateReference;
    var _stateNewRef = $("#state-selector").val();
    _stateNewRef = (_stateNewRef && _stateNewRef !== "_ADD_") ? _stateNewRef : '';

    if (_stateOldRef !== _stateNewRef) {
        if (_stateOldRef) {
            var _stateOldCfg = RED.nodes.node(_stateOldRef);
            if (_stateOldCfg) {
                var _stateIdx = _stateOldCfg.users.indexOf(node);
                if (_stateIdx !== -1) _stateOldCfg.users.splice(_stateIdx, 1);
                RED.events.emit("nodes:change", _stateOldCfg);
            }
        }
        if (_stateNewRef) {
            var _stateNewCfg = RED.nodes.node(_stateNewRef);
            if (_stateNewCfg && _stateNewCfg.users.indexOf(node) === -1) {
                _stateNewCfg.users.push(node);
                RED.events.emit("nodes:change", _stateNewCfg);
            }
        }
    }
    node.stateReference = _stateNewRef;

    window.__stateTemplateContext = null;
</script>

<script type="text/javascript" template-section="onIncludeEditCancel">
    var _stateAddHandler = $("#state-selector").data('nodeAddHandler');
    if (_stateAddHandler) {
        RED.events.off('nodes:add', _stateAddHandler);
        $("#state-selector").data('nodeAddHandler', null);
    }

    window.__stateTemplateContext = null;
</script>

<script type="text/html" template-section="onIncludeEditForm">
    <div id="state-no-providers-note" style="display:none;">
        <div class="form-row editorsectionheading">
            <i class="w-16 fa fa-exchange"></i> <span>State</span>
        </div>
        <div class="editorgroupborder">
            <div class="form-row nomargin" style="padding:8px;">
                <i class="fa fa-info-circle" style="color:#3f81b3;"></i>
                <span style="margin-left:4px;">No state providers available. The <strong>Internal State</strong> provider should be available by default.</span>
            </div>
        </div>
    </div>
    <div id="section_stateconfig" style="display:none;">
        <div class="form-row editorsectionheading">
            <i class="w-16 fa fa-exchange"></i> <span>State</span>
        </div>
        <div class="editorgroupborder">
            <div class="form-row nomargin">
                <label class="towb_editorlabel" for="state-selector">State Provider</label>
                <div style="width: 70%; display: inline-flex;">
                    <select id="state-selector" style="flex-grow: 1; min-width: 0;">
                        <option value="_ADD_">none</option>
                    </select>
                    <a id="state-edit-btn" class="red-ui-button disabled" style="margin-left: 10px; flex-shrink: 0;">
                        <i class="fa fa-pencil"></i>
                    </a>
                    <a id="state-add-btn" class="red-ui-button" style="margin-left: 10px; flex-shrink: 0;">
                        <i class="fa fa-plus"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
### State
: *state provider* (config) : the state backend that this node will use for persisting state. Provider-specific configuration appears inline below the selector.

Available built-in provider: **Internal State** - stores state in memory with optional persistence across redeployments and restarts.
</script>
