<div template-section="onIncludeOnce">
<!-- Logger-specific styles (base styles provided by BasicTemplate) -->
<script type="text/javascript">
    $('<style>').text(`
    .loggertype-dropdown {
        position: absolute;
        background: white;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        max-height: 150px;
        overflow-y: auto;
        z-index: 1000;
        min-width: 150px;
    }
    .loggertype-dropdown .dropdown-item {
        padding: 6px 12px;
        cursor: pointer;
    }
    .loggertype-dropdown .dropdown-item:hover {
        background: #f0f0f0;
    }
    `).appendTo('head');
</script>
</div>


<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("logEnabled", { value:false, required:true})
        .addDefault("loggerReference", { required:false, value:'', type:"DelegatedConfigReferenceNode"})
        .addDefault("logTemplateOverrideEnabled",  {value:false})
        .addDefault("logTemplateOverride", {value:"message:{{msg}}"})
</script>

<script type="text/javascript" template-section="onIncludeEditPrepare">
    // controls.
    let logEnabled = $("#{{defaults.logEnabled}}");
    let logTemplateEnabled = $("#{{defaults.logTemplateOverrideEnabled}}");
    let logTemplateEnabledSection = $("#section_logTemplateOverrideEnabled");
    let logEnabledSection = $("#section_logEnabled");
    let loggerSection = $("#section_loggerconfig");
    loggerSection.hide();

    // functions.
    let getLoggerTypes = async function(){
        let types = [];
        await $.ajax({
            url: "nodetypeservice/find?tag=LoggerType",
            type: "GET",
            contentType: "application/json; charset=utf-8",
            data:JSON.stringify({id:node.id}),
            success: (response) => {
                types = response;
            },
            error: (jqXHR, textStatus, errorThrown) => {
                console.log(jqXHR, textStatus, errorThrown);
            },
        });
        return types;
    }

    let getLoggers = async () => {
        let loggers = [];

        // get the list of types again.
        let loggerTypes = (await getLoggerTypes()).map(type => type.id);

        // add all of the known loggers.
        RED.nodes.eachConfig(cfg => { 
            if(loggerTypes.includes(cfg.type)){
                loggers.push({id:cfg.id, name:cfg.label(), type:cfg.type});
            }
        });

        return loggers;
    };

    let updateLoggerSelectorList = async () => {
        loggerSelector.empty();      
        (await getLoggers()).forEach(logger => {
            $('<option value="' + logger.id + '">' + logger.name + '</option>').appendTo(loggerSelector);
        });
        $('<option value="_ADD_">none</option>').appendTo(loggerSelector);
    }

    logEnabled.on('change', function() {
        if(logEnabled.prop("checked")){
            logEnabledSection.show();
            node._def.defaults.loggerReference.required = true;
        }
        else{
            logEnabledSection.hide()
            node._def.defaults.loggerReference.required = false;
        }
    });

    logTemplateEnabled.on('change', function() {
        if(logTemplateEnabled.prop("checked")){
            logTemplateEnabledSection.show();
            node._def.defaults.logTemplateOverride.required = true;
        }
        else{
            logTemplateEnabledSection.hide()
            node._def.defaults.logTemplateOverride.required = false;
        }
    });

    node.logTemplateOverrideEditor = RED.editor.createEditor({
        id: 'node-input-logTemplateOverrideEditor',
        mode: 'ace/mode/handlebars',
        value: node.logTemplateOverride
    });

    let loggerSelector = $("#logger-selector");
    let loggerEditButton = $("#logger-edit-btn");
    let loggerAddButton = $("#logger-add-btn");

    loggerSelector.val(node.loggerReference || '_ADD_');


    loggerEditButton.on('click', async function(event){
        event.stopPropagation();
        if(loggerEditButton.hasClass("disabled")){
            return;
        }

        // figure out what type of logger this is.
        let selectedLogger = (await getLoggers()).find(logger => logger.id === loggerSelector.val());
        RED.editor.editConfig("#logger-selector", selectedLogger.type, selectedLogger.id);
    });

    loggerAddButton.on('click', function(event) {
        event.stopPropagation();
        let $btn = $(event.target);

        // Remove any existing dropdown
        $('.loggertype-dropdown').remove();

        getLoggerTypes().then(loggerTypes => {
            let $dropdown = $('<div class="loggertype-dropdown red-ui-editor"></div>');

            loggerTypes.forEach(loggerType => {
                $('<div class="dropdown-item"></div>')
                .text(loggerType.name)
                .data('value', loggerType.id)
                .css({
                    padding: '4px 8px',
                    cursor: 'pointer'
                })
                .appendTo($dropdown);
            });

            // Append first so outerWidth() is measurable, then position so the
            // right edge of the dropdown aligns with the right edge of the button.
            $('body').append($dropdown);
            $dropdown.css({
                top:  $btn.offset().top + $btn.outerHeight(),
                left: $btn.offset().left + $btn.outerWidth() - $dropdown.outerWidth()
            });

            $(document).on('mousedown.dropdown', function(e) {
                if (!$(e.target).closest('.loggertype-dropdown').length) {
                    $dropdown.remove();
                    $(document).off('mousedown.dropdown'); // Clean up the listener
                }
            });

            // Handle item selection
            $dropdown.on('click', '.dropdown-item', function(e) {
                e.stopPropagation();
                const selectedValue = $(this).data('value');
                const selectedText = $(this).text();

                // Do whatever you need with the selection
                console.log('Selected:', selectedValue, selectedText);
                $dropdown.remove();
                RED.editor.editConfig("#logger-selector", selectedValue, "_ADD_");
            });
        })
    });

    loggerSelector.on("focus", updateLoggerSelectorList);
    loggerSelector.on('change', function(event) {
        if("_ADD_" === loggerSelector.val()){
            loggerEditButton.addClass("disabled")
        }
        else{
            loggerEditButton.removeClass("disabled")
        }
    });

    // Auto-select a newly created logger config node.
    let _loggerNodeAddHandler = function(addedNode) {
        getLoggerTypes().then(function(types) {
            let typeIds = types.map(function(t) { return t.id; });
            if (typeIds.indexOf(addedNode.type) < 0) return;
            updateLoggerSelectorList().then(() => {
                loggerSelector.val(addedNode.id);
                loggerSelector.trigger('change');
            });
        });
    };
    RED.events.on('nodes:add', _loggerNodeAddHandler);
    // Store handler for cleanup in onIncludeEditSave / onIncludeEditCancel.
    loggerSelector.data('nodeAddHandler', _loggerNodeAddHandler);

    // Show the logger section only if at least one logger type is registered.
    // If nodered_logging (or any other logger provider) is not installed,
    // show an informational note instead of the logger controls.
    let loggerNoProvidersNote = $("#logger-no-providers-note");
    getLoggerTypes().then(loggerTypes => {
        if (loggerTypes.length === 0) {
            loggerNoProvidersNote.show();
            return;
        }
        loggerSection.show();
        updateLoggerSelectorList().then(() => {
            loggerSelector.val(node.loggerReference || '_ADD_');
            loggerSelector.trigger('change');
        });
    });

</script>

<script type="text/javascript" template-section="onIncludeEditSave">
    node = this;

    // Clean up the nodes:add listener.
    var _logAddHandler = $("#logger-selector").data('nodeAddHandler');
    if (_logAddHandler) {
        RED.events.off('nodes:add', _logAddHandler);
        $("#logger-selector").data('nodeAddHandler', null);
    }

    // ── HERE BE DRAGONS ──────────────────────────────────────────────────
    // Node-RED's built-in reference counting (properties.js apply()) only
    // works for defaults whose form element follows the #node-input-<prop>
    // naming convention. Our logger/metrics selectors use custom IDs
    // because the built-in config-node picker is tied to a single type,
    // while we need to show a hierarchy of concrete implementations
    // (ConsoleLoggerConfigNode, RestLoggerConfigNode, etc.).
    //
    // We therefore manually manage configNode.users here, mirroring the
    // exact logic from Node-RED's apply() (properties.js lines 114-126).
    // ─────────────────────────────────────────────────────────────────────
    var _logOldRef = node.loggerReference;
    var _logNewRef = $("#logger-selector").val();
    _logNewRef = (_logNewRef && _logNewRef !== "_ADD_") ? _logNewRef : '';

    if (_logOldRef !== _logNewRef) {
        if (_logOldRef) {
            var _logOldCfg = RED.nodes.node(_logOldRef);
            if (_logOldCfg) {
                var _logIdx = _logOldCfg.users.indexOf(node);
                if (_logIdx !== -1) _logOldCfg.users.splice(_logIdx, 1);
                RED.events.emit("nodes:change", _logOldCfg);
            }
        }
        if (_logNewRef) {
            var _logNewCfg = RED.nodes.node(_logNewRef);
            if (_logNewCfg && _logNewCfg.users.indexOf(node) === -1) {
                _logNewCfg.users.push(node);
                RED.events.emit("nodes:change", _logNewCfg);
            }
        }
    }
    node.loggerReference = _logNewRef;

    node.logTemplateOverride = node.logTemplateOverrideEditor.getValue();
    node.logTemplateOverrideEditor.destroy();
    delete node.logTemplateOverrideEditor;
</script>

<script type="text/javascript" template-section="onIncludeEditCancel">
    // Clean up the nodes:add listener.
    var _logAddHandler = $("#logger-selector").data('nodeAddHandler');
    if (_logAddHandler) {
        RED.events.off('nodes:add', _logAddHandler);
        $("#logger-selector").data('nodeAddHandler', null);
    }

    node.logTemplateOverrideEditor.destroy();
    delete node.logTemplateOverrideEditor;
</script>

<script type="text/html" template-section="onIncludeEditForm">
    <div id="logger-no-providers-note" style="display:none;">
        <div class="form-row editorsectionheading">
            <i class="w-16 fa fa-eye"></i> <span>Logging</span>
        </div>
        <div class="editorgroupborder">
            <div class="form-row nomargin" style="padding:8px;">
                <i class="fa fa-info-circle" style="color:#3f81b3;"></i>
                <span style="margin-left:4px;">No logging providers installed. Install a logger plugin (e.g. <strong>@theotherwillembotha/node-red-logging</strong>) to enable logging on this node.</span>
            </div>
        </div>
    </div>
    <div id="section_loggerconfig" >
        <div class="form-row editorsectionheading">
            <i class="w-16 fa fa-eye"></i> <span>Logging</span>
        </div>
        <div class="editorgroupborder">
            <div class="form-row nomargin logEnableCheck">
                <label class="towb_editorlabel">&nbsp;</label>
                <input class="towb_checkbox" type="checkbox" id="{{defaults.logEnabled}}" placeholder="logEnabled" value="false">
                <label class="towb_checkboxlabel" for="{{defaults.logEnabled}}"><span>Enable Logging</span></label>
            </div>

            <div id="section_logEnabled">
                <div class="form-row nomargin">
                    <label class="towb_editorlabel" for="logger-selector">Logger</label>
                    <div style="width: 70%; display: inline-flex;">
                        <select id="logger-selector" style="flex-grow: 1;" class="">
                            <option value="_ADD_">none</option>
                        </select>
                        <a id="logger-edit-btn" class="red-ui-button disabled" style="margin-left: 10px;">
                            <i class="fa fa-pencil"></i>
                        </a>
                        <a id="logger-add-btn" class="red-ui-button" style="margin-left: 10px;">
                            <i class="fa fa-plus"></i>
                        </a>
                    </div>
                </div>

                <div class="form-row nomargin">
                    <label class="towb_editorlabel">&nbsp;</label>
                    <input class="towb_checkbox" type="checkbox" id="{{defaults.logTemplateOverrideEnabled}}" placeholder="" value="false">
                    <label class="towb_checkboxlabel" for="{{defaults.logTemplateOverrideEnabled}}"><span>Override Template</span></label>
                </div>

                <div id="section_logTemplateOverrideEnabled">
                    <div class="form-row">
                        <label class="towb_editorlabel" for="node-input-logTemplateOverrideEditor"><i class="fa fa-code"></i> Template</label>
                        <div style="height: 250px; min-height:150px;" class="node-text-editor" id="node-input-logTemplateOverrideEditor"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
### Logging
: *enable logging* (boolean)        : if checked, then the node will produce logging output to the specified logger.
: *logger* (logconfig)              : the endppoint that the node will log events to.
: *override template* (logconfig)   : if checked, a custom logging template can be provided for the log message.
: *logger template* (mustache)      : a template in mustache format to generate a message for logging purposes (see LoggerConfig node for more information)
</script>
