<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("resetOnDeploy", { value:false, required:false})
        .addDefault("metricsEnabled", { value:true, required:true})
        .addDefault("metricsReference", { required:true, value:'', type:"DelegatedConfigReferenceNode"})
        .addDefault("providerConfig", { value:{}, required:false})
</script>

<script type="text/javascript" template-section="onIncludeEditPrepare">
    let gaugeMetricSection = $("#section_gaugemetricconfig");
    let metricsContainer = gaugeMetricSection.find(".editorgroupborder");
    let metricsEnabledSection = metricsContainer.find("#section_metricsEnabled");

    let getMetricsProviderTypes = async function() {
        let types = [];
        await $.ajax({
            url: "nodetypeservice/find?tag=MetricsProvider",
            type: "GET",
            contentType: "application/json; charset=utf-8",
            success: (response) => { types = response; },
            error: (jqXHR, textStatus, errorThrown) => { console.log(jqXHR, textStatus, errorThrown); },
        });
        return types;
    };

    let getMetricsProviders = async () => {
        let providers = [];
        let providerTypes = (await getMetricsProviderTypes()).map(t => t.id);
        RED.nodes.eachConfig(cfg => {
            if (providerTypes.includes(cfg.type)) {
                providers.push({ id: cfg.id, name: cfg.label(), type: cfg.type });
            }
        });
        return providers;
    };

    let metricsSelector   = metricsContainer.find("#metrics-selector");
    let metricsEditButton = metricsContainer.find("#metrics-edit-btn");
    let metricsAddButton  = metricsContainer.find("#metrics-add-btn");

    let updateMetricsSelectorList = async () => {
        metricsSelector.empty();
        (await getMetricsProviders()).forEach(provider => {
            $('<option value="' + provider.id + '">' + provider.name + '</option>').appendTo(metricsSelector);
        });
        $('<option value="_ADD_">none</option>').appendTo(metricsSelector);
    };

    metricsEditButton.on('click', async function(event) {
        event.stopPropagation();
        if (metricsEditButton.hasClass("disabled")) return;
        let selectedProvider = (await getMetricsProviders()).find(p => p.id === metricsSelector.val());
        if (selectedProvider) {
            RED.editor.editConfig("#metrics-selector", selectedProvider.type, selectedProvider.id);
        }
    });

    metricsAddButton.on('click', function(event) {
        event.stopPropagation();
        let $btn = $(event.currentTarget);
        let btnOffset = $btn.offset();
        let btnH = $btn.outerHeight();
        let btnW = $btn.outerWidth();
        $('.metricstype-dropdown').remove();

        getMetricsProviderTypes().then(providerTypes => {
            let $dropdown = $('<div class="metricstype-dropdown red-ui-editor"></div>').css({
                position: 'absolute',
                zIndex: 1000
            });

            providerTypes.forEach(providerType => {
                $('<div class="dropdown-item"></div>')
                    .text(providerType.name)
                    .data('value', providerType.id)
                    .css({ padding: '4px 8px', cursor: 'pointer' })
                    .appendTo($dropdown);
            });

            $('body').append($dropdown);
            $dropdown.css({
                top:  btnOffset.top + btnH,
                left: Math.max(0, btnOffset.left + btnW - $dropdown.outerWidth())
            });

            $(document).on('mousedown.metricsdropdown', function(e) {
                if (!$(e.target).closest('.metricstype-dropdown').length) {
                    $dropdown.remove();
                    $(document).off('mousedown.metricsdropdown');
                }
            });

            $dropdown.on('click', '.dropdown-item', function(e) {
                e.stopPropagation();
                const selectedValue = $(this).data('value');
                $dropdown.remove();
                RED.editor.editConfig("#metrics-selector", selectedValue, "_ADD_");
            });
        });
    });

    metricsSelector.on("focus", updateMetricsSelectorList);
    metricsSelector.on('change', function() {
        if ("_ADD_" === metricsSelector.val()) {
            metricsEditButton.addClass("disabled");
        } else {
            metricsEditButton.removeClass("disabled");
        }
    });

    let _metricsNodeAddHandler = function(addedNode) {
        getMetricsProviderTypes().then(function(types) {
            let typeIds = types.map(function(t) { return t.id; });
            if (typeIds.indexOf(addedNode.type) < 0) return;
            updateMetricsSelectorList().then(() => {
                metricsSelector.val(addedNode.id);
                metricsSelector.trigger('change');
            });
        });
    };
    RED.events.on('nodes:add', _metricsNodeAddHandler);
    metricsSelector.data('nodeAddHandler', _metricsNodeAddHandler);

    let gaugeNoProvidersNote = $("#gauge-no-providers-note");
    getMetricsProviderTypes().then(providerTypes => {
        if (providerTypes.length === 0) {
            gaugeNoProvidersNote.show();
            return;
        }
        gaugeMetricSection.show();
        updateMetricsSelectorList().then(() => {
            metricsSelector.val(node.metricsReference || '_ADD_');
            metricsSelector.trigger('change');
        });
    });
</script>

<script type="text/javascript" template-section="onIncludeEditSave">
    node = this;

    var _metAddHandler = $("#metrics-selector").data('nodeAddHandler');
    if (_metAddHandler) {
        RED.events.off('nodes:add', _metAddHandler);
        $("#metrics-selector").data('nodeAddHandler', null);
    }

    // ── HERE BE DRAGONS — see LoggerTemplate.html for full explanation ──
    var _metOldRef = node.metricsReference;
    var _metNewRef = $("#metrics-selector").val();
    _metNewRef = (_metNewRef && _metNewRef !== "_ADD_") ? _metNewRef : '';

    if (_metOldRef !== _metNewRef) {
        if (_metOldRef) {
            var _metOldCfg = RED.nodes.node(_metOldRef);
            if (_metOldCfg) {
                var _metIdx = _metOldCfg.users.indexOf(node);
                if (_metIdx !== -1) _metOldCfg.users.splice(_metIdx, 1);
                RED.events.emit("nodes:change", _metOldCfg);
            }
        }
        if (_metNewRef) {
            var _metNewCfg = RED.nodes.node(_metNewRef);
            if (_metNewCfg && _metNewCfg.users.indexOf(node) === -1) {
                _metNewCfg.users.push(node);
                RED.events.emit("nodes:change", _metNewCfg);
            }
        }
    }
    node.metricsReference = _metNewRef;
    node.metricsEnabled = !!node.metricsReference;
</script>

<script type="text/javascript" template-section="onIncludeEditCancel">
    var _metAddHandler = $("#metrics-selector").data('nodeAddHandler');
    if (_metAddHandler) {
        RED.events.off('nodes:add', _metAddHandler);
        $("#metrics-selector").data('nodeAddHandler', null);
    }
</script>

<script type="text/html" template-section="onIncludeEditForm">
    <div id="gauge-no-providers-note" style="display:none;">
        <div class="form-row editorsectionheading">
            <i class="w-16 fa fa-tachometer"></i> <span>Gauge Metric</span>
        </div>
        <div class="editorgroupborder">
            <div class="form-row nomargin" style="padding:8px;">
                <i class="fa fa-info-circle" style="color:#3f81b3;"></i>
                <span style="margin-left:4px;">No metrics providers installed. Install a metrics plugin (e.g. <strong>@theotherwillembotha/node-red-prometheus</strong>) to enable metrics on this node.</span>
            </div>
        </div>
    </div>
    <div id="section_gaugemetricconfig" style="display:none;">
        <div class="form-row editorsectionheading">
            <i class="w-16 fa fa-tachometer"></i> <span>Gauge Metric</span>
        </div>
        <div class="editorgroupborder">
            <div class="form-row nomargin">
                <label class="towb_editorlabel">&nbsp;</label>
                <input class="towb_checkbox" type="checkbox" id="{{defaults.resetOnDeploy}}" value="false" />
                <label class="towb_checkboxlabel" for="{{defaults.resetOnDeploy}}"><span>Reset on Deploy</span></label>
            </div>

            <div id="section_metricsEnabled">
                <div class="form-row nomargin">
                    <label class="towb_editorlabel" for="metrics-selector">Metric Provider</label>
                    <div style="width: 70%; display: inline-flex;">
                        <select id="metrics-selector" style="flex-grow: 1; min-width: 0;">
                            <option value="_ADD_">none</option>
                        </select>
                        <a id="metrics-edit-btn" class="red-ui-button disabled" style="margin-left: 10px; flex-shrink: 0;">
                            <i class="fa fa-pencil"></i>
                        </a>
                        <a id="metrics-add-btn" class="red-ui-button" style="margin-left: 10px; flex-shrink: 0;">
                            <i class="fa fa-plus"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
### Gauge Metric
: *reset on deploy* (boolean) : if checked, the gauge resets to zero on each deploy.
: *metric provider* (config) : the metrics backend that this node will report to.
</script>
