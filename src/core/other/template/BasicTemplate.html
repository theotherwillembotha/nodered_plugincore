
<div template-section="onIncludeOnce">
<!-- BasicTemplate:includeOnce -->
<style>
  .editorgroupborder {
      border-width:1px;
      border-style:solid;
      border-color:lightgray;
      padding: 3px;
      margin-top: 2px;
      margin-bottom: 2px;
  }

  .editorsectionheading {
      font-weight: 600;
      margin-bottom:1px !important; 
      margin-top:6px !important; 
  }

  .nomargin {
      margin-bottom:1px !important; 
      margin-top:1px !important; 
  }

  .slidecontainer {
    width: 100%;
  }

  .slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 25px;
    background: #d3d3d3;
    outline: none;
    opacity: 0.7;
    -webkit-transition: .2s;
    transition: opacity .2s;
  }
  
  .slider:hover {
    opacity: 1;
  }
  
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 25px;
    height: 25px;
    background: #04AA6D;
    cursor: pointer;
  }
  
  .slider::-moz-range-thumb {
    width: 25px;
    height: 25px;
    background: #04AA6D;
    cursor: pointer;
  }
</style>

<style>
    .towb_editorlabel {
        width: 120px !important;
    }
    input.towb_editorfield, select.towb_editorfield, textarea.towb_editorfield {
        width: 70% !important;
    }
    input.towb_editorfield_short, select.towb_editorfield_short {
        width: 30% !important;
    }

    /* Node label colour helpers — use via .setLabelStyle() in onCompose */
    .node_label_white { fill: white; }
    .node_label_black { fill: black; }
</style>


</div>
